taxonomy_path: "taxonomy/taxonomy_v1.json"

embedding:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  use_hashing_encoder: false
  hashing_dim: 384
  batch_size: 32
routing:
  active_statuses:
    - "active"

  group_min_similarity: 0.16
  group_min_margin: 0.0

  topic_min_similarity: 0.30
  topic_min_margin: 0.0
  reject_on_low_margin: false

  topic_high_confidence: 0.48
  topic_high_confidence_margin: 0.03

  negative_penalty: 0.08
  topic_score_top_k: 2
  group_prior_weight: 0.0

  use_chunk_scoring: true
  chunk_score_weight: 0.35
  max_chunks: 8
  min_chunk_chars: 40
  max_chunk_chars: 700

  return_top_k_groups: 5
  return_top_k_topics: 10